name: Framebook
options:
  bundleIdPrefix: com.shimondeitel.framinglog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Framebook:
    type: application
    platform: iOS
    sources:
      - path: Framebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.framinglog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Framebook/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  FramebookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FramebookTests
      - path: Framebook.storekit
    dependencies:
      - target: Framebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.framinglog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  FramebookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FramebookUITests
    dependencies:
      - target: Framebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.framinglog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Framebook:
    build:
      targets:
        Framebook: all
        FramebookTests: [test]
        FramebookUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Framebook.storekit
    test:
      config: Debug
      storeKitConfiguration: Framebook.storekit
      targets:
        - FramebookTests
        - FramebookUITests
    archive:
      config: Release
